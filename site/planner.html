<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script>window.__cmfCore=fetch("data/core.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error("加载失败: data/core.json");return r.json()});</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一周菜单 · CookMyFridge</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%B3%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#e8632a">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container" id="main-content" tabindex="-1">
    <h2 class="section-title">🗓️ 一周菜单</h2>
    <p class="planner-intro">根据冰箱、口味、过敏原和饮食偏好，自动安排 1–4 周、每天午餐 + 晚餐不重样的菜，优先用现有食材。均衡评分只看三大营养素供能比，每日热量为两道菜的每人份估算之和（未计主食、早餐与烹饪损耗），仅作搭配参考，不替代专业营养建议。</p>
    <div class="planner-actions">
      <label class="weeks-select">菜单周数
        <select id="week-count">
          <option value="1">1 周 · 14 餐</option>
          <option value="2">2 周 · 28 餐</option>
          <option value="3">3 周 · 42 餐</option>
          <option value="4">4 周 · 56 餐</option>
        </select>
      </label>
      <button class="btn btn-primary btn-sm" id="btn-shuffle">重新生成整份</button>
      <button class="btn btn-sm" id="btn-export-ics">📅 导出日历（.ics）</button>
      <button class="btn btn-sm" id="btn-copy-week">📋 复制整份菜单</button>
      <button class="btn btn-sm" id="btn-subscribe">🔗 开启日历订阅</button>
    </div>
    <div id="week-diet-note"></div>
    <div id="balance-summary-root"></div>
    <div id="week-root"></div>
    <div id="shop-root"></div>
    <div id="subscribe-root"></div>
    <div class="page-spacer"></div>
  </main>

  <script src="js/bundle-boot.js"></script>
  <script src="js/bundle-features.js"></script>
  <script src="js/page-planner.js"></script>
</body>
</html>
