<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CookMyFridge · 冰箱开饭</title>
  <meta name="description" content="点选冰箱里的食材，数据集负责靠谱，AI 负责开脑洞。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍳%3C/text%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="theme-color" content="#e8632a">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <section class="hero">
      <h1>别点外卖，让冰箱开饭</h1>
      <p>点几样你冰箱里有的食材，数据集帮你找能做的菜，AI 帮你发明没见过的组合。</p>
      <div class="hero-actions">
        <button class="btn btn-primary" id="btn-random">🎲 随机开一局</button>
        <button class="btn" id="btn-blindbox-page">🎁 冰箱盲盒</button>
        <button class="btn" id="btn-surprise">🍽️ 随机看看</button>
      </div>
    </section>

    <div id="seasonal-banner"></div>
    <div id="weather-card"></div>

    <div class="search-box">
      <input type="search" id="ingredient-search" placeholder="搜索食材，输入名称后回车可直接添加，如：番茄、土豆…" autocomplete="off">
    </div>

    <div class="nl-box">
      <label for="nl-input" class="nl-label">一句话告诉我你有什么</label>
      <div class="nl-row">
        <input type="text" id="nl-input" placeholder="例如：我有两个西红柿、一块鸡胸肉和一把小葱" autocomplete="off">
        <button class="btn btn-sm" id="nl-voice" title="语音输入" aria-label="语音输入">🎤</button>
        <button class="btn btn-primary btn-sm" id="nl-add">添加</button>
      </div>
      <div id="nl-feedback" class="nl-feedback" aria-live="polite"></div>
    </div>

    <div id="ingredient-wall"><div class="empty">正在加载食材数据…（慢网络下 AI 创意数据会在后台继续加载，不影响先选菜）</div></div>
    <div class="page-spacer"></div>
  </main>

  <div class="cook-bar" id="cook-bar"></div>

  <script src="js/bundle.js"></script>
  <script src="js/page-home.js"></script>
</body>
</html>
