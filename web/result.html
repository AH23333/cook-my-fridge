<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>开饭结果 · CookMyFridge</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍳%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container">
    <div id="selection-summary" style="margin-top:18px"></div>

    <div class="filter-bar">
      <div class="filter-group">
        <label>烹饪方式</label>
        <select class="filter-select" id="filter-method"></select>
      </div>
      <div class="filter-group">
        <label>时间</label>
        <select class="filter-select" id="filter-time">
          <option value="">不限</option>
          <option value="10">10 分钟内</option>
          <option value="20">20 分钟内</option>
          <option value="40">40 分钟内</option>
        </select>
      </div>
      <div class="filter-group">
        <label>难度</label>
        <select class="filter-select" id="filter-difficulty"></select>
      </div>
    </div>

    <div id="allergen-toggle" style="margin:10px 0;display:none">
      <label style="font-size:13.5px;cursor:pointer"><input type="checkbox" id="hide-allergens"> 隐藏含我过敏原的菜</label>
    </div>

    <div id="unlock-panel"></div>
    <div id="buckets"></div>
    <div class="page-spacer"></div>
  </main>

  <script src="js/store.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/search.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/page-result.js"></script>
</body>
</html>
